services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockly
      POSTGRES_USER: stockly
      POSTGRES_PASSWORD: stockly
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stockly']
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes:
      - redisdata:/data

  backend:
    build: ./backend
    command: ['npm', 'run', 'dev']
    ports: ['3000:3000']
    environment:
      DATABASE_URL: postgresql://stockly:stockly@postgres:5432/stockly
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-change-in-prod
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-prod
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY}
      NEWS_API_KEY: ${NEWS_API_KEY}
      ML_SERVICE_URL: http://ml-service:8000
      NODE_ENV: development
      PORT: 3000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    volumes:
      - ./backend/src:/app/src  # hot reload

  ml-service:
    build: ./ml-service
    ports: ['8000:8000']
    environment:
      REDIS_URL: redis://redis:6379
      NEWS_API_KEY: ${NEWS_API_KEY}
    depends_on:
      redis: { condition: service_started }
    volumes:
      - ./ml-service:/app          # hot reload
      - ml-cache:/app/cache        # persist model weights

volumes:
  pgdata:
  redisdata:
  ml-cache:
